version: "3.9"

services:
  # 1. High-Concurrency Go Telemetry Streaming Microservice (Port 8766)
  telemetry-service:
    build:
      context: ./services/go-telemetry
      dockerfile: Dockerfile
    container_name: aeovexor-telemetry
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      - PORT=8766
      - STREAM_RATE_HZ=60
    networks:
      - aeovexor-net

  # 2. FastAPI Python Spatial Core Backend (Port 8765)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aeovexor-backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
      - HOST=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./artifacts:/app/artifacts
      - ./workspace:/app/workspace
    depends_on:
      - telemetry-service
    networks:
      - aeovexor-net

  # 3. Next.js 15 Modular Frontend (Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeovexor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8765
      - NEXT_PUBLIC_TELEMETRY_URL=http://localhost:8766
    depends_on:
      - backend-api
    networks:
      - aeovexor-net

networks:
  aeovexor-net:
    driver: bridge
