name: Polyglot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-test:
    name: C++17 SIMD Acceleration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B native/cpp/build -DCMAKE_BUILD_TYPE=Release native/cpp
      - name: Build C++ Core
        run: cmake --build native/cpp/build --config Release
      - name: Run C++ Test Executable
        run: ./native/cpp/build/test_spatialforge_cpp

  rust-test:
    name: Rust Zero-Copy LiDAR Parser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        working-directory: native/rust
        run: cargo test --verbose

  go-test:
    name: Go 60Hz Telemetry Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run Go Unit Tests
        working-directory: services/go-telemetry
        run: go test -v -race ./...

  python-test:
    name: Python Core & Benchmark Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Build C++ Shared Library for FFI Bridge
        run: |
          cmake -B native/cpp/build -DCMAKE_BUILD_TYPE=Release native/cpp
          cmake --build native/cpp/build --config Release
      - name: Run Pytest Suite
        run: pytest -v tests/

  frontend-build:
    name: Next.js 15 Modular Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Next.js Build
        working-directory: frontend
        run: npm run build
